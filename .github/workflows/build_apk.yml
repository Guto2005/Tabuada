name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Habilitar arquitetura i386 e instalar dependências
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential libssl-dev libffi-dev \
            libsqlite3-dev ccache \
            libncurses5:i386 libstdc++6:i386 zlib1g:i386 \
            python3-dev autoconf libtool \
            pkg-config libltdl-dev

      - name: Instalar buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Aceitar licenças do Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\n84831b9409646a918e30573bab4c9c91346d8abd\nd975f751698a77b662f1254ddbeed3901e976f5a" \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" \
            > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf "\n859f317696f67ef3d7f30a50a5560e7834b43903" \
            > ~/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license

      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build do APK
        run: |
          buildozer -v android debug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabuada-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload do log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            .buildozer/android/platform/build-*/dists/*/build.log
            buildozer.log
          retention-days: 7
