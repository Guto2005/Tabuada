name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Habilitar arquitetura i386 e instalar dependências
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential libssl-dev libffi-dev \
            libsqlite3-dev ccache \
            libncurses5:i386 libstdc++6:i386 zlib1g:i386 \
            python3-dev autoconf libtool \
            pkg-config libltdl-dev

      - name: Corrigir caminho do sdkmanager e instalar componentes
        run: |
          # Buildozer procura sdkmanager no caminho antigo — criamos o symlink
          sudo mkdir -p ${ANDROID_HOME}/tools/bin
          sudo ln -sf ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager ${ANDROID_HOME}/tools/bin/sdkmanager
          sudo ln -sf ${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager  ${ANDROID_HOME}/tools/bin/avdmanager

          # Aceitar todas as licenças e instalar NDK + build-tools
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platforms;android-33" \
            "ndk;25.2.9519653" \
            "platform-tools"

      - name: Instalar buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build do APK
        run: |
          buildozer -v android debug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: Tabuada-APK
          path: bin/*.apk
          retention-days: 30

      - name: Upload do log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            .buildozer/android/platform/build-*/dists/*/build.log
            buildozer.log
          retention-days: 7