name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Habilitar arquitetura i386 e instalar dependências
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential libssl-dev libffi-dev \
            libsqlite3-dev ccache \
            libncurses5:i386 libstdc++6:i386 zlib1g:i386 \
            python3-dev autoconf libtool \
            pkg-config libltdl-dev

      - name: Instalar buildozer e dependências Python
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache do Buildozer
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build do APK
        run: |
          buildozer -v android debug

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Tabuada-APK
          path: bin/*.apk
          retention-days: 30
